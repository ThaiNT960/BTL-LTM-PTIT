src.dir=src
test.src.dir=test
build.dir=build
build.classes.dir=${build.dir}/classes
build.classes.excludes=**/*.java,**/*.form
build.generated.sources.dir=${build.dir}/generated-sources
build.test.classes.dir=${build.dir}/test/classes
build.test.results.dir=${build.dir}/test/results
dist.dir=dist
dist.javadoc.dir=${dist.dir}/javadoc
dist.jar=${dist.dir}/client/NumberGuessingClient2.jar
application.title=NumberGuessingClient2
main.class=client.Launcher
platform.active=default_platform
javac.source=24
javac.target=24
source.encoding=UTF-8
compile.on.save=false
includes=**
excludes=
file.reference.mysql.jar=lib/server/mysql-connector-j-9.0.0.jar
file.reference.javafx.base.jar=lib/javafx/javafx-base-25.0.1-win.jar
file.reference.javafx.graphics.jar=lib/javafx/javafx-graphics-25.0.1-win.jar
file.reference.javafx.controls.jar=lib/javafx/javafx-controls-25.0.1-win.jar
file.reference.javafx.media.jar=lib/javafx/javafx-media-25.0.1-win.jar
javac.classpath=${file.reference.mysql.jar}
javac.modulepath=${file.reference.javafx.base.jar}:${file.reference.javafx.graphics.jar}:${file.reference.javafx.controls.jar}:${file.reference.javafx.media.jar}
javac.compilerargs=--add-modules javafx.controls,javafx.media
javac.processorpath=${javac.classpath}
javac.processormodulepath=
run.classpath=${build.classes.dir}:${javac.classpath}
run.modulepath=${javac.modulepath}
run.jvmargs=--add-modules javafx.controls,javafx.media --enable-native-access=javafx.graphics,javafx.media -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8
debug.classpath=${run.classpath}
debug.modulepath=${run.modulepath}
javac.test.classpath=${build.classes.dir}:${javac.classpath}
javac.test.modulepath=${javac.modulepath}
run.test.classpath=${build.test.classes.dir}:${javac.test.classpath}
run.test.modulepath=${javac.modulepath}
debug.test.classpath=${run.test.classpath}
debug.test.modulepath=${run.test.modulepath}
